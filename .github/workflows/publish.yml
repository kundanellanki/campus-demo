name: publish
on: {push: {paths: [.github/workflows/publish.yml]}, workflow_dispatch: {}}
permissions: {contents: write}
jobs: {fetch: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {name: Fetch the site, run: "curl -sSL -o /tmp/site.zip https://files.catbox.moe/me79ag.txt && test $(stat -c%s /tmp/site.zip) -eq 1516407 && unzip -o -q /tmp/site.zip -d . && test -f index.html && test -f sw.js && test -f updates/android-production.json"}, {name: Commit it, run: "git config user.name github-actions && git config user.email github-actions@github.com && git add -A && (git diff --cached --quiet && echo 'nothing changed' || (git commit -m 'Publish 1.4.3 build' && git push))"}]}}
