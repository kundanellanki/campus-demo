name: publish
on: {push: {paths: [.github/workflows/publish.yml]}, workflow_dispatch: {}}
permissions: {contents: write}
jobs: {fetch: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {name: Fetch the build, run: "curl -sSL -o index.html https://files.catbox.moe/9fbol9.txt && test $(stat -c%s index.html) -eq 1363233"}, {name: Commit it, run: "git config user.name github-actions && git config user.email github-actions@github.com && git add index.html && git commit -m 'Add the demo build' && git push"}]}}
