name: publish
on: {push: {paths: [.github/workflows/publish.yml]}, workflow_dispatch: {}}
permissions: {contents: write}
jobs: {fetch: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {name: Fetch the site, run: "curl -sSL -X POST -o /tmp/site.zip https://temp.sh/yWzmN/campus-website.zip && echo '6cc155f012a5553908c86f783e35ddbf190e3c5b2e2c521118068af53c3be57f  /tmp/site.zip' | sha256sum -c - && unzip -o -q /tmp/site.zip -d . && test -f index.html && test -f sw.js && test -f updates/android-production.json"}, {name: Commit it, run: "git config user.name github-actions && git config user.email github-actions@github.com && git add -A && (git diff --cached --quiet && echo 'nothing changed' || (git commit -m 'Publish 2026.0917.130129 build' && git push))"}]}}
