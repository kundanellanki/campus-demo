    <!--
      Every weight requested here is one the stylesheet actually uses — checked
      rule by rule, not assumed. Spectral 400 is `.pr-prompt`, 600 is every
      heading, 700 is the logo glyph; Plex Sans 400/500/600 and Mono 400/500
      all appear in src/styles.css. There is nothing here to trim.

      What was worth changing is that it no longer blocks the first paint. A
      stylesheet on a third-party origin costs a DNS lookup, a TLS handshake
      and a round trip before a phone on 3G may draw a single pixel — and
      `display=swap` already says we accept the fallback face first, so
      blocking on it bought nothing. media="print" makes the browser fetch it
      at low priority without waiting; onload promotes it the moment it lands.
    -->
    <link rel="stylesheet" media="print" onload="this.media='all'; this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
